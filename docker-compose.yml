services:
  # -------------------------------------------------------------
  # Infrastructure
  # -------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: central-platform-postgres
    environment:
      POSTGRES_USER: idarms
      POSTGRES_PASSWORD: idarms_dev_only
      POSTGRES_DB: idarms_root
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - central-platform-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idarms -d idarms_root"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - central-platform-net

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: central-platform-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: idarms
      RABBITMQ_DEFAULT_PASS: idarms_dev_only
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - central-platform-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - central-platform-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: central-platform-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - central-platform-net
    restart: unless-stopped

  # Self-hosted identity provider (real OIDC auth for the portal + federated
  # Google/Microsoft/GitHub, once configured in its own console). LoginV2 is
  # explicitly disabled so this stays a single container — the current upstream
  # default splits into zitadel-api + a separate zitadel-login service behind
  # Traefik, which this stack has no other use for.
  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.16.0
    container_name: central-platform-zitadel
    restart: unless-stopped
    user: "0"
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:-CROIPLocalDevMasterkey32Chars!!!}"
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://idarms:idarms_dev_only@postgres:5432/zitadel?sslmode=disable
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    ports:
      - "8080:8080"
    networks:
      - central-platform-net
    depends_on:
      postgres:
        condition: service_healthy


  # -------------------------------------------------------------
  # 1. Reporting Gateway Service (Port 3001)
  # -------------------------------------------------------------
  reporting-gateway-migrate:
    build:
      context: ./services/reporting-gateway-service
      target: migration
    environment:
      DATABASE_URL: postgresql://idarms:idarms_dev_only@postgres:5432/reporting_gateway?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - central-platform-net
    restart: "no"

  reporting-gateway-service:
    build:
      context: ./services/reporting-gateway-service
    container_name: central-platform-reporting-gateway
    environment:
      PORT: 3001
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://idarms:idarms_dev_only@postgres:5432/reporting_gateway?schema=public
      RABBITMQ_URL: amqp://idarms:idarms_dev_only@rabbitmq:5672
      NODE_ENV: development
      AUTH_MODE: disabled
      ZITADEL_ISSUER: https://auth.idarms.gov.gh
      JWT_ALLOWED_CLOCK_SKEW_SECONDS: "5"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      reporting-gateway-migrate:
        condition: service_completed_successfully
